# CI for Forgejo Actions. Same syntax as GitHub Actions.
#
# FIRST RUN WILL FAIL: `npm ci` needs a package-lock.json and this project has
# never been installed. Run `npm install`, commit the lockfile, then this
# passes. `npm ci` is used rather than `npm install` on purpose — CI should
# build the exact versions that were committed.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Typecheck and build
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Placeholders so the build doesn't fail on missing env. Real values
          # come from Keychain at runtime on the mini.
          OIDC_ISSUER: https://example.invalid
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
          AUTH_SECRET: ci-placeholder-not-a-real-secret

  image:
    name: Publish image
    needs: build
    # Only publish from main and tags — PRs get built but not pushed.
    if: github.event_name == 'push'
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Forgejo package registry
        # VERIFY: registry host and that packages are enabled on this Forgejo.
        # FORGEJO_TOKEN must be a repo secret with package:write scope.
        run: |
          echo "${{ secrets.FORGEJO_TOKEN }}" | \
            docker login git.a64.one -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE=git.a64.one/${{ github.repository }}
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
